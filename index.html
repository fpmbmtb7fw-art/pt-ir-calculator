<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172d46"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Pt Ir Calculator"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Pt Ir Calculator</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#152438;background:#f4f6f9}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}main{max-width:700px;margin:auto}header{padding:22px 2px 14px}h1{font-size:25px;margin:0 0 5px}small,.muted{color:#66758a}.tabs{display:flex;gap:8px;margin:0 0 15px}.tabs button{flex:1}.tab{background:#e3e8ef;color:#1b314c}.tab.active{background:#172d46;color:white}.card{background:white;border:1px solid #e0e5ed;border-radius:17px;padding:16px;margin-bottom:14px}textarea{width:100%;font-size:17px;line-height:1.5;min-height:180px;border:1px solid #cbd3df;border-radius:12px;padding:12px;resize:vertical}button{font-size:16px;font-weight:650;border:0;border-radius:11px;padding:12px 17px;min-height:44px;cursor:pointer}.primary{background:#172d46;color:white}.light{background:#e7ebf1;color:#172d46}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{border:1px solid #e0e5ed;border-radius:12px;padding:12px;min-width:0}.metric span{display:block;font-size:12px;color:#66758a}.metric strong{font-size:23px;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #e8ecf1;padding:11px 5px;text-align:right;font-size:14px}th:first-child,td:first-child{text-align:left}.hidden{display:none}.error{color:#a52020;margin-top:9px;font-size:14px}.entry{display:block;width:100%;text-align:left;background:#f3f6fa;margin:9px 0;padding:13px}.entry strong{display:block}.entry span{display:block;font-size:13px;color:#5b6b80;margin-top:5px}.row{display:flex;align-items:center;gap:8px}.row .entry{flex:1;min-width:0}.danger{color:#a52020;background:#fff0f0}.notice{font-size:13px;color:#68788b;line-height:1.5}label{font-weight:650;display:block;margin-bottom:8px}</style></head><body><main><header><h1>Pt / Ir Calculator</h1><small>Offline XRF measurement calculator</small></header><nav class="tabs"><button id="tabCalc" class="tab active">Calculator</button><button id="tabHistory" class="tab">History</button></nav><section id="calculator"><div class="card"><label for="measurements">Pt / Ir readings</label><textarea id="measurements" placeholder="33 25&#10;37 22&#10;39 21"></textarea><p class="notice">တစ်ကြောင်းမှာ Pt Ir တစ်တွဲစီ ထည့်ပါ။ ဥပမာ: 33 25</p><div class="actions"><button class="primary" id="calculate">Calculate</button><button class="light" id="clear">Clear</button></div><div id="error" class="error" role="alert"></div></div><section id="results" class="hidden"><div class="card"><div class="grid"><div class="metric"><span>Average Pt</span><strong id="avgPt">—</strong></div><div class="metric"><span>Average Ir</span><strong id="avgIr">—</strong></div><div class="metric"><span>Measurements</span><strong id="count">—</strong></div><div class="metric"><span>Pt + Ir Avg</span><strong id="combined">—</strong></div></div><table><thead><tr><th>Result</th><th>Pt %</th><th>Ir %</th></tr></thead><tbody id="statsRows"></tbody></table><div class="actions"><button class="primary" id="save">Save to History</button></div></div></section></section><section id="history" class="hidden"><div class="card"><h2 style="font-size:19px;margin:0 0 8px">Saved Measurements</h2><div id="historyItems"></div><p class="notice">History ကို ဒီ iPhone ထဲမှာပဲ သိမ်းထားပါတယ်။ App data ဖျက်ရင် History ပျောက်နိုင်ပါတယ်။</p></div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let current=null;const key='ptir-pwa-history-v1';const fmt=n=>Number.isFinite(n)?n.toFixed(2):'—';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function stats(v){let n=v.length,avg=v.reduce((a,b)=>a+b,0)/n,min=Math.min(...v),max=Math.max(...v);return {avg,min,max,range:max-min,sd:n>1?Math.sqrt(v.reduce((s,x)=>s+(x-avg)**2,0)/(n-1)):0}}function read(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}function store(items){try{localStorage.setItem(key,JSON.stringify(items));return true}catch{return false}}function showTab(name){$('calculator').classList.toggle('hidden',name!=='calc');$('history').classList.toggle('hidden',name!=='history');$('tabCalc').classList.toggle('active',name==='calc');$('tabHistory').classList.toggle('active',name==='history');if(name==='history')renderHistory()};function showResults(pairs){const p=stats(pairs.map(x=>x[0])),i=stats(pairs.map(x=>x[1]));$('avgPt').textContent=fmt(p.avg)+'%';$('avgIr').textContent=fmt(i.avg)+'%';$('count').textContent=pairs.length;$('combined').textContent=fmt(p.avg+i.avg)+'%';$('statsRows').innerHTML=[['Average','avg'],['Minimum','min'],['Maximum','max'],['Range','range'],['Std. Deviation','sd']].map(([label,k])=>'<tr><td>'+label+'</td><td>'+fmt(p[k])+'</td><td>'+fmt(i[k])+'</td></tr>').join('');$('results').classList.remove('hidden')}function calculate(){const lines=$('measurements').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),pairs=[];$('error').textContent='';if(!lines.length){$('error').textContent='Pt / Ir တန်ဖိုး ထည့်ပါ။';return}for(let idx=0;idx<lines.length;idx++){const pieces=lines[idx].split(/[\s,;]+/).filter(Boolean);if(pieces.length!==2||pieces.some(s=>!/^\d+(?:\.\d+)?$/.test(s))){$('error').textContent='Line '+(idx+1)+' မှာ Pt Ir တန်ဖိုးနှစ်ခု ထည့်ပါ။';return}const nums=pieces.map(Number);if(nums.some(n=>!Number.isFinite(n)||n<0||n>100)||nums[0]+nums[1]>100.000001){$('error').textContent='Line '+(idx+1)+' မှာ percentage မမှန်ပါ။';return}pairs.push(nums)}if(pairs.length>500){$('error').textContent='တစ်ခါလျှင် 500 readings အထိသာ ထည့်ပါ။';return}current=pairs;showResults(pairs)}function renderHistory(){const data=read().sort((a,b)=>b.date.localeCompare(a.date));$('historyItems').innerHTML=data.length?'':'<p class="muted">သိမ်းထားတဲ့ History မရှိသေးပါ။</p>';for(const item of data){const p=stats(item.pairs.map(x=>x[0])),i=stats(item.pairs.map(x=>x[1]));const wrap=document.createElement('div');wrap.className='row';const open=document.createElement('button');open.className='entry';open.innerHTML='<strong>'+esc(new Date(item.date).toLocaleString())+'</strong><span>Pt '+fmt(p.avg)+'% · Ir '+fmt(i.avg)+'% · '+item.pairs.length+' readings</span>';open.addEventListener('click',()=>{$('measurements').value=item.pairs.map(v=>v.join(' ')).join('\n');current=item.pairs;showResults(item.pairs);showTab('calc')});const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.setAttribute('aria-label','Delete history');del.addEventListener('click',()=>{if(confirm('ဒီ History ကို ဖျက်မလား?')){store(read().filter(x=>x.id!==item.id));renderHistory()}});wrap.append(open,del);$('historyItems').append(wrap)}}$('calculate').addEventListener('click',calculate);$('clear').addEventListener('click',()=>{$('measurements').value='';current=null;$('results').classList.add('hidden');$('error').textContent=''});$('save').addEventListener('click',()=>{if(!current)return;const entries=read();entries.push({id:Date.now()+'-'+Math.random(),date:new Date().toISOString(),pairs:current});if(store(entries)){showTab('history')}else{$('error').textContent='History သိမ်းလို့မရပါ။ Browser storage ကို စစ်ပါ။'}});$('tabCalc').addEventListener('click',()=>showTab('calc'));$('tabHistory').addEventListener('click',()=>showTab('history'));if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}})();
</script></body></html>
